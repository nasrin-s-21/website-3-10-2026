<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connections | Skill Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="connections">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">
          <span class="brand-mark">S</span>
          <span>Skill Exchange</span>
        </a>
        <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="search.html">Explore Skills</a>
          <a href="connections.html" class="active">Connections</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="profile.html?myProfile=true">My Profile</a>
        </nav>
      </div>
    </header>

    <main class="container page-content">
      <section class="card-style section-header-box">
        <div>
          <span class="eyebrow">Your network</span>
          <h2>Connections</h2>
        </div>
      </section>

      <section class="two-column-layout">
        <div class="card-style">
          <h3>Sent Requests</h3>
          <div id="sent-requests-list" class="stack-list"></div>
        </div>

        <div class="card-style">
          <h3>Accepted Connections</h3>
          <div id="accepted-connections-list" class="stack-list"></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/connections.js"></script>
  </body>
</html>
